<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36" role="img" aria-label="Run in AccessFlows">
  <title>Run in AccessFlows</title>
  <rect x="0.5" y="0.5" width="179" height="35" rx="6" fill="#0B62C4" stroke="#08509F"/>
  <!-- A play mark: the badge is a button that runs the collection, so it uses the mark every player
       uses. It sits straight on the badge — no plate of its own — with round joins so the triangle
       does not read as a hard slash at this size. -->
  <path
    d="M13.5 11.5 25 18 13.5 24.5Z"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <text
    x="38"
    y="23"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="0.2"
  >Run in AccessFlows</text>
</svg>
