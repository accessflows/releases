<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run in AccessFlows</title>
    <meta name="referrer" content="no-referrer" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8fb;
        color: #10151d;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main {
        width: min(560px, 100%);
        padding: 28px;
        border: 1px solid #dde4ee;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(12, 32, 62, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0 0 18px; color: #4a5768; }
      a.button {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 6px;
        background: #0b62c4;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover { background: #08509f; }
      .link {
        margin-top: 18px;
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #dde4ee;
        border-radius: 6px;
        background: #f9fbfe;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 10px 14px;
        border: 1px solid #dde4ee;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .note { margin: 14px 0 0; font-size: 13px; color: #6b7889; }
      .failed { display: none; margin-top: 12px; color: #8a1f1f; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1319; color: #e7edf5; }
        main { background: #151c25; border-color: #24303d; box-shadow: none; }
        p, .note { color: #9aa8b8; }
        input { background: #101822; border-color: #24303d; }
        button { background: #151c25; border-color: #24303d; color: inherit; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Run in AccessFlows</h1>
      <p>This page hands the collection beside it to the AccessFlows app. Nothing is downloaded.</p>

      <a class="button" id="open" href="#">Open in AccessFlows</a>

      <div class="link">
        <input id="target" readonly aria-label="AccessFlows link" />
        <button type="button" id="copy">Copy</button>
      </div>

      <p class="note">If the app does not open, install AccessFlows first, or copy the link and open it from the app.</p>
      <p class="failed" id="failed">The app did not answer. Copy the link above and open it yourself.</p>
    </main>

    <script>
      // GitHub (and most hosts) strip a custom scheme from a Markdown link, so the badge points at this
      // page with an https address and this page asks the operating system for the app instead.
      //
      //   /run?snapshot=<uuid>      a collection shared in the AccessFlows directory
      //   /run?url=<https address>  a collection document served anywhere
      (function () {
        var params = new URLSearchParams(window.location.search);
        var snapshot = (params.get('snapshot') || '').trim();
        var documentUrl = (params.get('url') || '').trim();

        var target = snapshot
          ? 'accessflows://import?snapshot=' + encodeURIComponent(snapshot)
          : documentUrl
            ? 'accessflows://import?url=' + encodeURIComponent(documentUrl)
            : '';

        var openLink = document.getElementById('open');
        var field = document.getElementById('target');

        if (!target) {
          openLink.removeAttribute('href');
          openLink.setAttribute('aria-disabled', 'true');
          field.value = '';
          return;
        }

        openLink.href = target;
        field.value = target;

        document.getElementById('copy').addEventListener('click', function () {
          field.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(target).catch(function () {
              document.execCommand('copy');
            });
          } else {
            document.execCommand('copy');
          }
        });

        // Asked automatically, because the badge was a button and a reader who clicked it meant "open
        // it". The visible button stays for the case where nothing happens.
        window.location.href = target;
      })();
    </script>
  </body>
</html>
